name: site-tests
on:
  schedule:
    - cron: '0 1 * * *' # 6:30 AM IST
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma list: ic,inlearn,inmeet,inmedia (or all)'
        default: 'all'
permissions:
  contents: read
  issues: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
    steps:
      - id: pick
        run: |
          S="${{ github.event.inputs.sites || 'all' }}"
          if [ "$S" = "all" ] || [ -z "$S" ]; then S="ic,inlearn,inmeet,inmedia"; fi
          JSON=$(printf '%s' "$S" | jq -cR 'split(",")')
          echo "sites=$JSON" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.matrix.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Playwright (390x844)
        run: SITES=${{ matrix.site }} npx playwright test --project=${{ matrix.site }}
        working-directory: tests
      - name: Link check
        run: SITES=${{ matrix.site }} node run-links.js
        working-directory: tests
      - name: Lighthouse CI (mobile)
        continue-on-error: true
        working-directory: tests
        run: |
          BASE=$(node -e "console.log(require('./sites')['${{ matrix.site }}'].base)")
          npx lhci collect --numberOfRuns=1 --url="$BASE/" --settings.emulatedFormFactor=mobile || true
          npx lhci upload --target=temporary-public-storage || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-tests-${{ matrix.site }}
          path: |
            tests/playwright-report/
            tests/results/
          retention-days: 30
      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const site = '${{ matrix.site }}';
            const title = `[site-tests] ${site} failing`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            const body = `Site tests failing for **${site}**.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nTime: ${new Date().toISOString()}\n\nDownload the run artifacts for the HTML report and 390px screenshots.`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Close issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const site = '${{ matrix.site }}';
            const title = `[site-tests] ${site} failing`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
