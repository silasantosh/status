name: site-tests
on:
  schedule:
    - cron: '0 1 * * *' # 6:30 AM IST
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma list: ic,inlearn,inmeet (or all)'
        default: 'all'
permissions:
  contents: read
  issues: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
    steps:
      - id: pick
        run: |
          S="${{ github.event.inputs.sites || 'all' }}"
          if [ "$S" = "all" ] || [ -z "$S" ]; then S="ic,inlearn,inmeet"; fi
          JSON=$(printf '%s' "$S" | jq -cR 'split(",")')
          echo "sites=$JSON" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.matrix.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Playwright (390x844)
        run: SITES=${{ matrix.site }} npx playwright test --project=${{ matrix.site }}
        working-directory: tests
      - name: Link check
        run: SITES=${{ matrix.site }} node run-links.js
        working-directory: tests
      - name: Lighthouse CI (mobile)
        continue-on-error: true
        working-directory: tests
        run: |
          BASE=$(node -e "console.log(require('./sites')['${{ matrix.site }}'].base)")
          npx lhci collect --numberOfRuns=1 --url="$BASE/" --settings.emulatedFormFactor=mobile || true
          npx lhci upload --target=temporary-public-storage || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-tests-${{ matrix.site }}
          path: |
            tests/playwright-report/
            tests/results/
          retention-days: 30
      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const site = '${{ matrix.site }}';
            const title = `[site-tests] ${site} failing`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            const body = `Site tests failing for **${site}**.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nTime: ${new Date().toISOString()}\n\nDownload the run artifacts for the HTML report and 390px screenshots.`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Close issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const site = '${{ matrix.site }}';
            const title = `[site-tests] ${site} failing`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }

  # ---- Security scanners (approved Oct 21: advisory week one - findings are
  # annotations + artifacts only, never failures, never issues, values never printed) ----
  security-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history
      - name: gitleaks (pinned 8.30.1, checksum-verified, fully redacted)
        run: |
          set -e
          mkdir -p results
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep "linux_x64.tar.gz" gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact=100 --report-format json --report-path results/gitleaks.raw.json . || true
          # strip Line/Match fields so no secret material can appear in the artifact at all
          jq 'if type == "array" then map(del(.Line, .Match, .Secret)) else [] end' results/gitleaks.raw.json > results/gitleaks.json
          rm -f results/gitleaks.raw.json
          COUNT=$(jq 'length' results/gitleaks.json)
          echo "gitleaks findings: **${COUNT}** (advisory; values redacted and stripped)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" = "0" ]; then echo "::notice title=gitleaks::clean"; else echo "::warning title=gitleaks::${COUNT} potential secret(s) - redacted; see security-repo artifact"; fi
      - name: OSV-Scanner (pinned 2.7.0, checksum-verified)
        run: |
          set -e
          mkdir -p results
          curl -sSfLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          curl -sSfLO https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          grep "linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=tests/package-lock.json --format json --output-file results/osv.json --verbosity error || true
          COUNT=$(jq '[.results[].packages[]? | select(.vulnerabilities != null and (.vulnerabilities | length > 0))] | length' results/osv.json 2>/dev/null || echo 0)
          echo "OSV vulnerable dev-deps: **${COUNT}** (advisory; test toolchain only)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" = "0" ]; then echo "::notice title=OSV-Scanner::clean"; else echo "::warning title=OSV-Scanner::${COUNT} vulnerable dev-dependency record(s); see security-repo artifact"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-repo
          path: results/
          retention-days: 30

  security-zap:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.matrix.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - id: base
        run: echo "url=$(node -e "console.log(require('./tests/sites')['${{ matrix.site }}'].base)")" >> "$GITHUB_OUTPUT"
      - name: OWASP ZAP baseline (pinned v0.15.0, advisory, no issues)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        continue-on-error: true
        with:
          target: ${{ steps.base.outputs.url }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ matrix.site }}
